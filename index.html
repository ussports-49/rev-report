<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Conversion Tracker</title>
  <style>
    :root {
      --bg: #070a0f;
      --panel: #0d121a;
      --panel-2: #121824;
      --border: #1d2636;
      --text: #e6edf7;
      --muted: #7f90a8;
      --blue: #1d8cf8;
      --green-bright: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .wrap { max-width: 1360px; margin: 0 auto; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .title-area h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .clock-pill {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .clock-pill strong { color: var(--text); font-weight: 600; }

    .quick-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn-grad {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(90deg, #0ea5e9, #10b981);
    }

    .filter-bar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .date-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .date-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    .btn-generate {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .range-pills { display: flex; gap: 6px; flex-wrap: wrap; }

    .range-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .range-btn.active {
      background: #1e293b;
      color: #fff;
      border-color: #334155;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    @media (max-width: 1050px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr; }
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .stat-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .stat-val { font-size: 24px; font-weight: 700; }
    .stat-val.blue { color: #38bdf8; }
    .stat-val.green { color: var(--green-bright); }

      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 14px;
      margin-bottom: 1
